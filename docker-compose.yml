# Lokale AnythingLLM + Ollama voor MarkFluence. Documenten verlaten dit netwerk niet.
# Start:  docker compose up -d
# Eenmalig modellen ophalen (daarna werkt alles zonder internet):
#   docker compose exec ollama ollama pull ${LLM_MODEL:-qwen3:8b}
#   docker compose exec ollama ollama pull nomic-embed-text
# Daarna AnythingLLM openen op http://localhost:3001, workspace + API-key aanmaken.

services:
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Zuiniger met videogeheugen (RTX 4060 Laptop, 8 GB): zonder dit past een 9B-model niet helemaal in de GPU en wordt het traag.
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Model blijft geladen (standaard 5 min) en maar één context-slot, zodat het in 8 GB videogeheugen past.
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "1"
    # NVIDIA-GPU (vereist NVIDIA Container Toolkit / WSL2-GPU); zonder GPU: verwijder dit blok
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  anythingllm:
    image: mintplexlabs/anythingllm
    restart: unless-stopped
    depends_on: [ollama]
    ports:
      - "3001:3001"
    cap_add: [SYS_ADMIN]
    environment:
      STORAGE_DIR: /app/server/storage
      DISABLE_TELEMETRY: "true"
      LLM_PROVIDER: ollama
      OLLAMA_BASE_PATH: http://ollama:11434
      OLLAMA_MODEL_PREF: ${LLM_MODEL:-qwen3:8b}
      OLLAMA_MODEL_TOKEN_LIMIT: "8192"
      # AnythingLLM stuurt zelf een keep-alive mee (standaard 300 s) en negeert daarmee OLLAMA_KEEP_ALIVE van Ollama.
      OLLAMA_KEEP_ALIVE_TIMEOUT: "86400"
      EMBEDDING_ENGINE: ollama
      EMBEDDING_BASE_PATH: http://ollama:11434
      EMBEDDING_MODEL_PREF: nomic-embed-text
      EMBEDDING_MODEL_MAX_CHUNK_LENGTH: "8192"
      VECTOR_DB: lancedb
    volumes:
      - anythingllm:/app/server/storage

volumes:
  ollama:
  anythingllm:
