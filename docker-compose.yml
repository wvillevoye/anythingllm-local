# Lokale AnythingLLM + Ollama voor ConMark. Documenten verlaten dit netwerk niet.
# Start:  docker compose up -d
# Eenmalig modellen ophalen (daarna werkt alles zonder internet):
#   docker compose exec ollama ollama pull ${LLM_MODEL:-qwen3:8b}
#   docker compose exec ollama ollama pull nomic-embed-text
# Daarna AnythingLLM openen op http://localhost:3001, workspace + API-key aanmaken.

services:
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # NVIDIA-GPU (vereist NVIDIA Container Toolkit / WSL2-GPU); zonder GPU: verwijder dit blok
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  anythingllm:
    image: mintplexlabs/anythingllm
    restart: unless-stopped
    depends_on: [ollama]
    ports:
      - "3001:3001"
    cap_add: [SYS_ADMIN]
    environment:
      STORAGE_DIR: /app/server/storage
      DISABLE_TELEMETRY: "true"
      LLM_PROVIDER: ollama
      OLLAMA_BASE_PATH: http://ollama:11434
      OLLAMA_MODEL_PREF: ${LLM_MODEL:-qwen3:8b}
      OLLAMA_MODEL_TOKEN_LIMIT: "8192"
      EMBEDDING_ENGINE: ollama
      EMBEDDING_BASE_PATH: http://ollama:11434
      EMBEDDING_MODEL_PREF: nomic-embed-text
      EMBEDDING_MODEL_MAX_CHUNK_LENGTH: "8192"
      VECTOR_DB: lancedb
    volumes:
      - anythingllm:/app/server/storage

volumes:
  ollama:
  anythingllm:
